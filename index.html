    <script>
        async function fetchCountryData() {
            const input = document.getElementById('countryInput').value.trim();
            const loadingState = document.getElementById('loadingState');
            const errorState = document.getElementById('errorState');
            const resultState = document.getElementById('resultState');

            // Reset UI states elements instantly
            loadingState.style.display = 'none';
            errorState.style.display = 'none';
            resultState.style.display = 'none';

            if (!input) {
                errorState.textContent = "❌ Please enter a country name first.";
                errorState.style.display = 'block';
                return;
            }

            // SHOW LOADING INDICATOR BEFORE REQUEST COMPLETES
            loadingState.style.display = 'block';

            try {
                // Fetch dynamic web data requests asynchronously
                const response = await fetch(`https://restcountries.com{encodeURIComponent(input)}`);
                
                // FORCE ERROR CASE EXCEPTION HANDLER IF 404 DETECTED
                if (!response.ok) {
                    throw new Error(`Could not find any country matching "${input}". Please verify your spelling.`);
                }

                const data = await response.json();
                
                // FIX: Ensure data is an array and contains at least one item before reading it
                if (!data || data.length === 0) {
                    throw new Error(`The registry returned an empty response for "${input}".`);
                }

                // Extract the first matching country item safely
                const country = data[0]; 

                // Safely format currency array parsing layers
                let currencyName = "N/A";
                if (country.currencies && Object.keys(country.currencies).length > 0) {
                    const firstCurrencyKey = Object.keys(country.currencies)[0];
                    const currencyObj = country.currencies[firstCurrencyKey];
                    currencyName = `${currencyObj.name || firstCurrencyKey} (${currencyObj.symbol || ''})`;
                }

                // Populate values safely into interface layout structures
                document.getElementById('flag').src = country.flags ? country.flags.svg : '';
                document.getElementById('flag').alt = `Flag of ${country.name?.common || 'Country'}`;
                document.getElementById('name').textContent = country.name?.common || 'N/A';
                document.getElementById('capital').textContent = country.capital ? country.capital.join(', ') : 'N/A';
                document.getElementById('region').textContent = `${country.region || 'N/A'} (${country.subregion || ''})`;
                document.getElementById('population').textContent = country.population ? country.population.toLocaleString() : '0';
                document.getElementById('currency').textContent = currencyName;

                // DISPLAY SUCCESS OUTPUT STATE
                resultState.style.display = 'block';

            } catch (err) {
                // DISPLAY CLEAR ERROR MESSAGE STATE
                errorState.textContent = `❌ Error: ${err.message}`;
                errorState.style.display = 'block';
            } finally {
                // ALWAYS HIDE LOADING INDICATOR
                loadingState.style.display = 'none';
            }
        }

        // Add Enter key event listener shortcut to text inputs
        document.getElementById('countryInput').addEventListener('keypress', function(e) {
            if (e.key === 'Enter') fetchCountryData();
        });
    </script>
